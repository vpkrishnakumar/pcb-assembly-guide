name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: ./build.sh
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: PCB-Assembly-Guide
          path: build/*.app
